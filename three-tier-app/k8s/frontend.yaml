apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Replace with your own registry image, e.g:
          # <dockerhub-username>/three-tier-frontend:latest
          image: <YOUR_DOCKERHUB_USERNAME>/three-tier-frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: LoadBalancer   # use NodePort if practicing on Minikube/Kind
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80

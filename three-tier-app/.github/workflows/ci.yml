name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate backend syntax
        run: python -m compileall backend

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build backend image
        run: docker build -t three-tier-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t three-tier-frontend:ci ./frontend

      - name: Start containers
        run: docker compose up -d --build

      - name: Health check
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:5000/health >/dev/null 2>&1 && curl -fsS http://localhost:8080 >/dev/null 2>&1; then
              echo "Stack is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Services did not become healthy"
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Stop containers
        if: always()
        run: docker compose down -v
